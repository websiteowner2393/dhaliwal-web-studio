<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft background glow -->
  <rect x="2" y="3" width="36" height="34" rx="4" fill="url(#update_grad_soft)" opacity="0.12"/>
  
  <!-- Browser window frame -->
  <rect x="2.5" y="3.5" width="35" height="33" rx="3.5" stroke="url(#update_grad)" stroke-width="1.6"/>
  
  <!-- Browser top bar separator -->
  <line x1="2.5" y1="11.5" x2="37.5" y2="11.5" stroke="url(#update_grad)" stroke-width="1.2" opacity="0.6"/>
  
  <!-- Window dots (traffic lights) -->
  <circle cx="6.5" cy="7.5" r="1.5" fill="url(#update_grad)"/>
  <circle cx="11.5" cy="7.5" r="1.5" fill="url(#update_grad)" opacity="0.75"/>
  <circle cx="16.5" cy="7.5" r="1.5" fill="url(#update_grad)" opacity="0.5"/>
  
  <!-- Layout wireframe content blocks -->
  <rect x="6" y="15" width="11" height="7" rx="1.5" stroke="url(#update_grad)" stroke-width="1.2" fill="url(#update_grad)" fill-opacity="0.2"/>
  <line x1="20" y1="16" x2="33" y2="16" stroke="url(#update_grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.75"/>
  <line x1="20" y1="19.5" x2="29" y2="19.5" stroke="url(#update_grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
  
  <!-- Content lines bottom -->
  <line x1="6" y1="26" x2="15" y2="26" stroke="url(#update_grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <line x1="6" y1="29.5" x2="13" y2="29.5" stroke="url(#update_grad)" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>
  
  <!-- Circular update / improvement badge on bottom right -->
  <circle cx="28" cy="27" r="8" fill="#1e1815" stroke="url(#update_grad)" stroke-width="1.5"/>
  <!-- Circular refresh arrows -->
  <path d="M25 25.2C25.6 24.5 26.5 24 27.5 24C29.4 24 31 25.6 31 27.5C31 28.3 30.7 29.1 30.2 29.7" stroke="url(#update_grad)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M24.5 23.5V25.5H26.5" stroke="url(#update_grad)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M31 28.8C30.4 29.5 29.5 30 28.5 30C26.6 30 25 28.4 25 26.5C25 25.7 25.3 24.9 25.8 24.3" stroke="url(#update_grad)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M31.5 30.5V28.5H29.5" stroke="url(#update_grad)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <defs>
    <linearGradient id="update_grad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0.259" stop-color="#FFDB6E"/>
      <stop offset="1" stop-color="#FFBC5E"/>
    </linearGradient>
    <linearGradient id="update_grad_soft" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFDB6E"/>
      <stop offset="100%" stop-color="#FFBC5E"/>
    </linearGradient>
  </defs>
</svg>
